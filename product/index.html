<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Richly Matcha | Product page design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@300;400;500&family=DM+Sans:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<!--
  Product page design for AYA / ZEN / TAKUMI, drawn in the store's own look (Luxe theme).
  ?p=aya | zen | takumi      &lang=ja  shows the Japanese version for review (the live page is English)
  &bf=1  shows the page as it should look during Black Friday (Nov 18-30). The discount is automatic at checkout,
         so the theme's price stays the same and a box under the price shows the Black Friday price.
  Everything inside <main class="rm-pdp"> is the page. The top strip and header are preview-only.
-->
<style>
  body{margin:0;background:#ecebe6}
  .pv{background:#3d3e3b;color:#fff;font:400 12.5px/1.6 "Noto Sans JP",sans-serif;padding:7px 12px;text-align:center}
  .pv a{color:#fff;margin:0 6px;white-space:nowrap}
  .pv a.on{font-weight:500;text-decoration:none;border-bottom:1px solid #fff}
  .bar{background:#ecebe6;color:#4b6c4f;text-align:center;font:400 12px/1.4 "Reddit Sans","Noto Sans JP",sans-serif;padding:8px 12px}
  .head{background:#4b6c4f;height:64px;display:flex;align-items:center;justify-content:center;position:relative}
  .head img{height:26px}
  .head nav{position:absolute;left:24px;display:flex;gap:18px;font:400 11px/1 "DM Sans",sans-serif;letter-spacing:.06em;color:#fff;text-transform:uppercase}
  .head .r{position:absolute;right:24px;color:#fff;font:400 13px "DM Sans",sans-serif}

  .rm-pdp{
    --bg:#ecebe6;--panel:#f4f3ef;--ink:#3d3e3b;--text:#505050;--soft:#66675f;--green:#4b6c4f;--green-d:#3d5a41;--line:#d3d1c9;--star:#1f7a63;
    --sans:"Reddit Sans","Noto Sans JP",Arial,sans-serif;--ui:"DM Sans","Noto Sans JP",Arial,sans-serif;
    background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased
  }
  .rm-pdp *{box-sizing:border-box;margin:0;padding:0}
  .rm-pdp img{display:block;max-width:100%}
  .rm-pdp .wrap{width:min(1180px, 100% - 48px);margin-inline:auto}
  .rm-pdp h1,.rm-pdp h2,.rm-pdp h3{font-weight:300;color:var(--ink);letter-spacing:-.005em}
  .rm-pdp .num{font-variant-numeric:lining-nums tabular-nums}
  .ja .rm-pdp{line-break:strict;word-break:auto-phrase}

  /* product area */
  .pdp{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;padding:28px 0 64px}
  .gal-main{background:var(--bg);aspect-ratio:1;position:relative;overflow:hidden}
  .gal-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .gal-grid div{aspect-ratio:1;overflow:hidden;background:#e4e3dd}
  .gal-grid img{width:100%;height:100%;object-fit:cover}
  .thumbs{display:none}
  /* PC: the photos stay in view while the right column scrolls. If the photos are taller than the screen, they stop with their bottom edge in view. */
  .gal{--gw:calc((min(1180px, 100vw - 48px) - 56px) * 7 / 12);position:sticky;top:min(20px, calc(100vh - var(--gw) * 1.5 - 32px));align-self:start}
  .info{align-self:start}
  .tag{font-family:var(--ui);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
  .ja .tag{letter-spacing:.06em;text-transform:none}
  h1{font-size:28px;line-height:1.25;margin-top:6px}
  .stars{color:var(--star);font-size:13px;letter-spacing:.06em;margin-top:6px}
  .stars span{color:var(--soft);letter-spacing:0;font-size:12.5px;margin-left:4px}
  .price{font-size:20px;color:var(--ink);font-weight:400;margin-top:14px}
  .bfbox{margin-top:10px;border:1px solid var(--green);background:var(--panel);padding:10px 12px;color:var(--ink);font-size:13px;line-height:1.5}
  .bfbox b{display:block;font-weight:500;color:var(--green);font-size:15px}
  .bfbox small{color:var(--soft);font-size:12px}
  .ship{font-size:13.5px;line-height:1.5;color:var(--text);margin-top:4px}
  .ship u{color:var(--ink)}
  .desc{margin-top:16px;font-size:15px}
  .pay{font-size:12px;margin-top:12px;color:var(--ink)}
  .pay b{color:#5a31f4;font-weight:600}
  .qty-l{font-size:12px;margin-top:16px}
  .qty{margin-top:4px;display:inline-flex;border:1px solid #9c9c96;height:38px;align-items:center}
  .qty span{width:38px;text-align:center;color:var(--soft)}
  .opts{margin-top:14px;border:1px solid #9c9c96;background:#f7f6f2;padding:12px 14px;font-size:13px}
  .opts p+p{margin-top:8px}
  .opts .r{display:inline-block;width:13px;height:13px;border:1px solid #777;border-radius:50%;margin-right:8px;vertical-align:-2px}
  .opts .r.on{background:radial-gradient(#555 42%, transparent 48%)}
  .opts small{float:right;color:var(--soft);font-size:12.5px}
  .subnote{font-size:12.5px;line-height:1.5;color:var(--text);margin-top:7px}
  .subnote u{color:var(--ink)}
  .btn{display:block;margin-top:16px;background:var(--green);color:#fff;text-align:center;font-family:var(--ui);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:15px;text-decoration:none}
  .ja .btn{text-transform:none;letter-spacing:.04em}
  .shopbtn{margin-top:8px;background:#5a31f4;color:#fff;text-align:center;font-weight:600;font-size:14px;padding:12px}
  .why{margin-top:18px;display:flex;gap:14px;align-items:center;background:var(--panel);padding:12px 14px 12px 12px}
  .why img{flex:none;width:84px;height:84px;object-fit:cover;object-position:62% 30%}
  .why p{font-size:13.5px;line-height:1.5;color:var(--text)}
  .why b{display:block;font-weight:400;color:var(--ink);font-size:14.5px;margin-bottom:2px}
  .why a{color:var(--ink);white-space:nowrap}
  .quote{margin-top:18px;font-size:14px;line-height:1.55;color:var(--ink)}
  .quote i{display:block;font-style:normal;color:var(--star);font-size:12px;letter-spacing:.06em;margin-bottom:3px}
  .quote span{display:block;font-size:12.5px;color:var(--soft);margin-top:4px}
  .quote a{color:var(--ink)}
  .stk{display:none}
  .icons{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:16px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .icons div{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink)}
  .icons svg{flex:none;width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .ups{margin-top:22px}
  .ups h3{font-size:16px;font-weight:400}
  .ups-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .ups-grid div{background:var(--panel);padding:10px}
  .ups-grid img{width:100%;aspect-ratio:1;object-fit:cover}
  .ups-grid p{font-size:12.5px;margin-top:8px;color:var(--ink);line-height:1.4;min-height:2.8em}
  .ups-grid em{display:block;font-style:normal;color:var(--text);margin-top:2px}
  .ups-grid .add{margin-top:8px;border:1px solid var(--ink);text-align:center;font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px}
  .ups-note{font-size:12.5px;color:var(--text);margin-top:8px}
  .acc{margin-top:22px;border-top:1px solid var(--line)}
  .acc details{border-bottom:1px solid var(--line)}
  .acc summary{list-style:none;cursor:pointer;padding:14px 2px;display:flex;justify-content:space-between;font-size:15px;color:var(--ink);font-weight:400}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::after{content:"+";color:var(--green);font-family:var(--ui)}
  .acc details[open] summary::after{content:"–"}
  .acc .body{padding:0 2px 16px;font-size:14px}
  .acc ol{list-style:none;counter-reset:s}
  .acc ol li{counter-increment:s;position:relative;padding-left:32px;margin-top:10px}
  .acc ol li:first-child{margin-top:0}
  .acc ol li::before{content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--green);color:#fff;font:500 11px/21px var(--ui);text-align:center}
  .acc .ch p+p{margin-top:8px}
  .acc .ch b{font-weight:400;color:var(--ink)}
  .acc .ch .me{background:#e6e4dc;margin:0 -8px;padding:6px 8px}
  .acc .body p+p{margin-top:8px}

  /* founder */
  .founder{background:var(--panel)}
  .founder .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center;padding:0}
  .founder img{width:100%;aspect-ratio:3/2;object-fit:cover;object-position:50% 35%}
  .founder .tx{padding:40px 40px 40px 0}
  .founder .eb{font-family:var(--ui);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
  .ja .founder .eb{letter-spacing:.06em}
  .founder h2{font-size:28px;line-height:1.25;margin:10px 0 14px}
  .founder a{display:inline-block;margin-top:16px;font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:2px;text-decoration:none}

  /* reviews */
  .revs{padding:64px 0}
  .revs h2{font-size:26px}
  .revs .sum{margin-top:6px;color:var(--star)}
  .revs .sum b{color:var(--ink);font-weight:400;font-size:20px;margin-right:6px}
  .rv{border-top:1px solid var(--line);padding:20px 0;max-width:760px}
  .rv:first-of-type{margin-top:20px}
  .rv .st{color:var(--star);font-size:14px;letter-spacing:.06em}
  .rv .who{font-weight:400;color:var(--ink);margin-top:4px}
  .rv .who small{color:var(--soft);font-weight:300;margin-left:8px}
  .rv h4{font-weight:400;font-size:16px;color:var(--ink);margin-top:8px}
  .rv p{margin-top:6px;font-size:14.5px}

  /* three matchas */
  .three{padding:0 0 72px}
  .three h2{font-size:24px;text-align:center;margin-bottom:24px}
  .three-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:900px;margin:0 auto;text-align:center}
  .three-grid a{text-decoration:none;color:inherit;padding:18px 10px;border:1px solid transparent}
  .three-grid a.cur{border-color:var(--line);background:var(--panel)}
  .three-grid img{height:210px;width:auto;margin:-18px auto -14px}
  .three-grid h3{font-size:18px;font-weight:400;margin-top:10px}
  .three-grid p{font-size:13px;color:var(--soft)}

  @media (max-width:900px){
    .pdp{grid-template-columns:1fr;gap:0;padding-top:0}
    .gal-main{aspect-ratio:5/4}
    .gal-grid{display:none}
    .thumbs{display:flex;gap:6px;justify-content:center;padding:8px 0 16px}
    .thumbs i{width:44px;height:44px;border:1px solid var(--line);background:#e4e3dd center/cover no-repeat}
    .thumbs i.on{border-color:var(--ink);background-size:contain}
    .gal{position:static}
    h1{font-size:23px}
    .founder .wrap{grid-template-columns:1fr;gap:0}
    .founder .tx{padding:24px 24px 30px}
    .founder h2{font-size:24px}
    .revs{padding:44px 0}
    .three-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .three-grid img{height:132px;margin:-12px auto -10px}
    .three-grid h3{font-size:15px}
    .head nav{display:none}
    .rm-pdp{padding-bottom:66px}
    .stk{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;align-items:center;gap:12px;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;transform:translateY(100%);transition:transform .2s}
    .stk.on{transform:none}
    .stk p{flex:1;font-size:13px;line-height:1.3;color:var(--ink);font-weight:400}
    .stk p small{display:block;font-weight:300;color:var(--soft);font-size:12px}
    .stk a{flex:none;background:var(--green);color:#fff;font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:13px 18px;text-decoration:none}
    .ja .stk a{text-transform:none;letter-spacing:.04em}
  }
  @media (max-width:420px){
    .rm-pdp .wrap{width:calc(100% - 32px)}
    .founder .wrap{width:100%}
    .icons{grid-template-columns:1fr 1fr;gap:10px 10px}
  }
</style>
</head>
<body>
<p class="pv" id="pv"></p>
<p class="bar" id="bar"></p>
<div class="head"><nav id="nav"></nav><img src="img/logo.png" alt="Richly Matcha"><span class="r" id="bag"></span></div>

<main class="rm-pdp">
  <div class="wrap pdp">
    <div class="gal">
      <div class="gal-main"><img id="g0" alt=""></div>
      <div class="thumbs" id="thumbs"></div>
      <div class="gal-grid"><div><img id="g1" alt=""></div><div><img id="g2" alt=""></div></div>
    </div>
    <div class="info">
      <p class="tag" id="tag"></p>
      <h1 id="title"></h1>
      <p class="stars" id="stars"></p>
      <p class="price num" id="price"></p>
      <div class="bfbox" id="bfbox" hidden></div>
      <p class="ship" id="ship"></p>
      <p class="desc" id="desc"></p>
      <p class="pay" id="pay"></p>
      <p class="qty-l" id="qtyl"></p>
      <div class="qty"><span>−</span><span>1</span><span>+</span></div>
      <div class="opts" id="opts"></div>
      <p class="subnote" id="subnote"></p>
      <a class="btn" href="#" id="add"></a>
      <div class="shopbtn" id="shopbtn"></div>
      <!-- the reason to choose this matcha, in two lines: Text block or Custom Liquid under the buy buttons -->
      <div class="why"><img src="img/eri-master-leaves.jpg" alt=""><p id="why"></p></div>
      <p class="quote" id="quote"></p>
      <div class="icons" id="icons"></div>
      <div class="ups" id="ups"></div>
      <div class="acc" id="acc"></div>
    </div>
  </div>

  <section class="founder" id="story">
    <div class="wrap">
      <img src="img/eri-master-leaves.jpg" alt="">
      <div class="tx">
        <p class="eb" id="feb"></p>
        <h2 id="fh"></h2>
        <p id="fp"></p>
        <a href="https://richlymatcha.com/pages/our-story" id="fa"></a>
      </div>
    </div>
  </section>

  <section class="wrap revs" id="revs"></section>

  <section class="wrap three">
    <h2 id="threeh"></h2>
    <div class="three-grid" id="three"></div>
  </section>

  <!-- mobile only: stays at the bottom once the Add to bag button scrolls out of view (Luxe: sticky buy buttons) -->
  <div class="stk" id="stk"></div>
</main>

<script>
const q = new URLSearchParams(location.search);
const P = (q.get('p') || 'aya').toLowerCase();
const JA = q.get('lang') === 'ja';
if (JA) { document.documentElement.lang = 'ja'; document.body.classList.add('ja'); }
const BF = q.get('bf') === '1';
const L = (en, ja) => JA ? ja : en;
const U = (p, ja, bf) => '?p=' + p + (ja ? '&lang=ja' : '') + (bf ? '&bf=1' : '');

const ICON = {
  truck:'<svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/></svg>',
  box:'<svg viewBox="0 0 24 24"><path d="M4 9h16v11H4zM12 9v11M4 9l2-4h12l2 4"/></svg>',
  leaf:'<svg viewBox="0 0 24 24"><path d="M12 21c0-7 0-11 7-16-1 8-3 12-7 16zM12 21c0-5-2-8-7-10 1 5 3 8 7 10z"/></svg>',
  cup:'<svg viewBox="0 0 24 24"><path d="M5 9h12v6a5 5 0 01-5 5h-2a5 5 0 01-5-5zM17 11h2a2 2 0 010 4h-2"/></svg>',
  seed:'<svg viewBox="0 0 24 24"><path d="M12 3c4 4 5 9 0 18-5-9-4-14 0-18zM12 8v9"/></svg>'
};

const latteSteps = [
  L('<b>Add matcha and hot water.</b> 2 teaspoons (about 4g) of matcha and about 1.5 oz (40 ml) of water, around 158°F (70°C).','<b>抹茶とお湯を入れる。</b>抹茶小さじ2（約4g）と、70℃くらいのお湯を40ml。'),
  L('<b>Whisk.</b> Briskly, in an “M” motion, until smooth and foamy.','<b>点てる。</b>「M」の字を描くように素早く、なめらかに泡立つまで。'),
  L('<b>Pour over milk.</b> 7–8 oz (200–240 ml), with ice if you like. Oat milk is our favorite.','<b>牛乳に注ぐ。</b>200〜240ml。お好みで氷を。おすすめはオーツミルク。')
];
const whiskSteps = [
  L('<b>Sift the matcha.</b> 1 teaspoon (about 2g) into a bowl.','<b>抹茶をふるう。</b>小さじ1（約2g）を茶碗に。'),
  L('<b>Add hot water.</b> About 2 oz (60–70 ml), around 158–167°F (70–75°C).','<b>お湯を注ぐ。</b>70〜75℃くらいのお湯を60〜70ml。'),
  L('<b>Whisk and drink.</b> Briskly, in an “M” motion, until a fine foam forms. Drink it right away.','<b>点てて、すぐに。</b>「M」の字を描くように素早く、きめ細かい泡が立つまで。')
];

const D = {
  aya: {
    name:'AYA', title:'AYA Ceremonial Grade Uji Matcha 30g', price:'39.00', sub:'35.10', bfp:'23.40', rc:3,
    pay:L('Zero interest · 2 payments of $19.50 with <b>shop</b>','金利なし・<b>shop</b>で$19.50の2回払い'),
    shipL:L('$5 flat-rate U.S. shipping. <u>Free on orders over $75</u>: two tins, or a tin and a whisk.','米国内の送料は一律$5。<u>$75以上のご注文で無料</u>（2缶、または1缶と茶筅）。'),
    quote:[L('“I usually make it as a latte, and there’s no bitterness at all.”','「いつもラテにしていますが、苦みはまったくありません。」'),'Elizabeth'],
    imgs:['p-aya.png','latte-pour.jpg','aya-powder.jpg'],
    tag:L('Our most approachable matcha','いちばん飲みやすい抹茶'),
    desc:L('Start here if you’re new to real matcha. AYA is smooth and gentle, with balanced umami and just a hint of bitterness. Drink it straight or as a latte. The matcha comes through either way.',
           '本格的な抹茶が初めてなら、ここから。AYAはなめらかでやさしい味わいで、うまみのバランスがよく、苦みはほんのわずか。そのままでも、ラテにしても、抹茶の味がしっかり残ります。'),
    icons:[['truck',L('Ships in 1–2 business days','1〜2営業日で発送')],['box',L('Free U.S. shipping over $75','$75以上で米国内送料無料')],['leaf',L('First harvest from Uji, Kyoto','京都・宇治の一番茶')],['cup',L('About 7 lattes, or 15 cups straight, per tin','1缶でラテ約7杯、そのまま飲むなら約15杯')]],
    upsH:L('New to matcha? Add a whisk.','初めてなら、茶筅もいっしょに。'),
    ups:[['whisk-resin.jpg','Ivory Resin Matcha Whisk','38.00'],['whisk-bamboo.jpg','White Bamboo Matcha Whisk','76.00']],
    upsN:L('Add either whisk and your order ships free.','どちらの茶筅を足しても、送料無料になります。'),
    howH:L('How to make a matcha latte','抹茶ラテの作り方'), how:latteSteps,
    taste:L('Smooth and approachable with balanced umami, gentle bitterness, and a clean, refreshing character.','なめらかで親しみやすく、うまみのバランスがよく、苦みはやさしく、すっきりとした後味。'),
    origin:L('Uji, Kyoto · Okumidori Cultivar · First Harvest · Sheared · Direct-Cover Shade-Grown · Stone-Milled','京都・宇治／品種：おくみどり／一番茶／機械摘み／直がけ（覆い下栽培）／石臼挽き'),
    revs:[
      ['Elizabeth','09/17/2026','',L('Really fresh and smooth with a clean finish. I usually make it as a latte, and there’s no bitterness at all. The matcha flavor still comes through beautifully even with milk. It’s perfect for everyday matcha.','とても新鮮でなめらか、後味がすっきりしています。いつもラテにしていますが、苦みはまったくありません。牛乳と合わせても抹茶の味がきれいに出ます。毎日の抹茶にぴったりです。')],
      ['Edward','07/22/2026',L('Great taste','すばらしい味'),L('This was my first time trying Aya Matcha, and I was genuinely impressed by how fragrant it is. The moment I opened the tin, a soft, rich aroma filled the air, and the color was a beautiful vivid green that was a joy just to look at.','AYAを飲むのは初めてでしたが、香りの良さに本当に感動しました。缶を開けた瞬間、やわらかく豊かな香りが広がり、色は見ているだけでうれしくなる、きれいな鮮やかな緑でした。')],
